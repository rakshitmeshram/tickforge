[project]
name = "tickforge"
version = "1.1.0"
description = "Python interface and research tools for the tickforge C++ matching engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
research = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.package-data]
tickforge = ["libtickforge_c.so", "libtickforge_c.dylib", "tickforge_c.dll", "libtickforge_c.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
